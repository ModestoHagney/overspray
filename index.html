<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Overspray</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=IBM+Plex+Sans:wght@400;500;600&family=IBM+Plex+Mono:wght@400;500&family=Rubik+Spray+Paint&display=swap" rel="stylesheet">
<link rel="stylesheet" href="next/app.css">
<link rel="icon" href="icon.svg">
<link rel="manifest" href="manifest.webmanifest">
</head>
<body>
<div class="app">
  <header class="bar">
    <span class="brand"><svg class="mark" viewBox="0 0 20 20" aria-hidden="true"><g transform="translate(6.8 9.4) rotate(34.4)"><rect x="-2.6" y="-3.38" width="5.2" height="9.88" rx=".73"/><path d="M-2.6-3.7Q-2.6-5.2-1.04-5.4H1.04Q2.6-5.2 2.6-3.7Z"/><rect x="-.88" y="-6.5" width="1.77" height=".98" rx=".26"/><rect x=".88" y="-6.33" width=".42" height=".49"/></g><circle cx="12.4" cy="5.85" r=".55"/><circle cx="13.2" cy="6.2" r=".5"/><circle cx="13.6" cy="7" r=".45"/><circle cx="14.1" cy="6.4" r=".45"/><circle cx="14.5" cy="7.6" r=".5"/><circle cx="14" cy="8.1" r=".35"/><circle cx="15.4" cy="7.2" r=".4"/><circle cx="15.6" cy="8.6" r=".45"/><circle cx="14.9" cy="9.3" r=".35"/><circle cx="16.8" cy="8.3" r=".35"/><circle cx="16.5" cy="9.6" r=".35"/><circle cx="15.9" cy="10.4" r=".3"/></svg>Overspray</span>
    <nav class="menus" id="menus" aria-label="Menus"></nav>
    <div class="modes" id="modes" role="group" aria-label="Mode"></div>
    <div class="right">
      <button class="icon" id="btn-undo" title="Undo (Ctrl+Z)" aria-label="Undo" disabled><svg viewBox="0 0 20 20"><path d="M7 5 3 9l4 4"/><path d="M3 9h9a4 4 0 0 1 0 8h-1"/></svg></button>
      <button class="icon" id="btn-redo" title="Redo (Ctrl+Y or Ctrl+Shift+Z)" aria-label="Redo" disabled><svg viewBox="0 0 20 20"><path d="m13 5 4 4-4 4"/><path d="M17 9H8a4 4 0 0 0 0 8h1"/></svg></button>
      <button class="icon" id="btn-theme" title="Light or dark" aria-label="Switch between light and dark"><svg viewBox="0 0 20 20"><circle cx="10" cy="10" r="6.5"/><path d="M10 3.5a6.5 6.5 0 0 0 0 13z" fill="currentColor"/></svg></button>
      <button class="pill" id="btn-live" aria-pressed="false" title="Send every change to the car in iRacing"><i></i>Live</button>
    </div>
  </header>
  <nav class="tools" id="tools" aria-label="Tools"></nav>
  <main class="stage" id="stage">
    <canvas id="view"></canvas>
    <div class="empty" id="empty" hidden>
      <p>Load a car's template to start.</p>
      <button class="btn main" id="btn-empty-template">Load template…</button>
      <p class="small">No template yet? <a href="https://www.tradingpaints.com/cartemplates" target="_blank" rel="noopener">Download one from Trading Paints</a></p>
    </div>
    <div class="foot"><div class="zoom"><button id="btn-zoom-out" title="Zoom out (−)" aria-label="Zoom out">−</button><span id="zoom-readout">Fit</span><button id="btn-zoom-in" title="Zoom in (+)" aria-label="Zoom in">+</button><button id="btn-fit" title="Fit to screen (F)" aria-label="Fit to screen">⤢</button></div>
    <div class="pos" id="pos" hidden title="Where the selection's top-left corner is on the sheet, in pixels. Type a number to move it there."><label>X<input id="pos-x" type="number" step="1"></label><label>Y<input id="pos-y" type="number" step="1"></label></div>
    <div class="hint" id="hint"></div></div>
    <div class="shapebox" id="shapebox" hidden><header><b>Draw a shape</b><span>Everything drawn here becomes one shape</span><span class="gap"></span><button class="btn" id="sb-wrap" data-act="wrap" title="One shape pulled tight round the selected ones, like a rubber band: two circles become a slot" disabled>Wrap</button><button class="btn" id="sb-split" data-act="split" title="One shape for each piece again" disabled>Split</button><button class="btn" id="sb-fillIn" data-act="fillIn" title="Make it solid: its holes are filled" disabled>Fill in</button><i class="sep"></i><button class="btn" data-act="cancelShape" title="Throw this drawing away and go back to the livery">Cancel</button><button class="btn main" data-act="saveDrawnShape" title="Join everything drawn into one shape and keep it in Your shapes (Ctrl+S)">Save to library</button></header></div>
    <div class="toast" id="toast" role="status" hidden></div>
    <div class="toolopts" id="toolopts" hidden></div>
    <aside class="dock" id="dock"></aside>
  </main>
</div>
<dialog id="dlg"><form method="dialog"><h3 id="dlg-title"></h3><div class="dbody" id="dlg-body"></div><footer><button type="button" class="btn" id="dlg-cancel">Cancel</button><button class="btn main" id="dlg-ok" value="ok">OK</button></footer></form></dialog>
<input type="file" id="file-template" accept=".psd,image/*" hidden>
<input type="file" id="file-map" accept=".json,application/json" hidden>
<input type="file" id="file-palette" accept=".json,application/json" hidden>
<input type="file" id="file-image" accept="image/*" hidden>
<input type="file" id="file-paint" accept=".tga,image/png,image/jpeg" hidden>
<input type="file" id="file-shape" accept=".svg,image/svg+xml" hidden>
<input type="file" id="file-font" accept=".ttf,.otf,.woff,.woff2" hidden>
<script src="version.js"></script>
<script type="module" src="next/app.js"></script>
</body>
</html>
